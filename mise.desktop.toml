[bootstrap.packages]
# ds4 host build tools. The ROCm stack (hipcc, rocminfo, rocm-smi, hipblas*,
# rocblas, rocwmma, hipcub, …) is installed from AMD's repo by amferd's
# docs/setup/fedora-rocm.md runbook (amdrocm-core-devel10.0-*), not Fedora's
# rocm-*/hip* RPMs — do not reintroduce those here; the two stacks conflict.
"dnf:make" = "latest"
"dnf:gcc" = "latest"
"dnf:clang" = "latest"
# llama.cpp
"dnf:cmake" = "latest"
"dnf:ninja-build" = "latest"
"dnf:vulkan-headers" = "latest"
"dnf:vulkan-loader-devel" = "latest"
"dnf:glslc" = "latest"
"dnf:spirv-headers-devel" = "latest"

[dotfiles]
"~/.config/mise/config.desktop.toml" = "mise.desktop.toml"
"~/.config/llama.cpp/models.ini" = { source = "llama/models.ini" }
"~/.config/llama.cpp/llama-server.env" = { source = "llama/llama-server.env" }
"~/.config/llama.cpp/qwen-fixed-chat_template.jinja" = { source = "llama/qwen-fixed-chat_template.jinja" }
"~/.config/llama.cpp/qwen-fixed-chat_template_oneline.txt" = { source = "llama/qwen-fixed-chat_template_oneline.txt" }
"~/.config/systemd/user/llama-server.service" = { source = "llama/llama-server.service" }
