min_version = { soft = "2026.8.16" }
# Login shell is intentionally POSIX (/bin/bash) — do not adopt [bootstrap.user] login_shell.

[settings]
experimental = true
color_theme = "catppuccin"
idiomatic_version_file_enable_tools = ["rust"]

[settings.dotfiles]
root = "~/.dotfiles"

[bootstrap.hooks.pre-dotfiles]
run = "mkdir -p -m 700 $HOME/.ssh/sockets"

[bootstrap.hooks.final]
run = "mise run configure-forge-remotes"

[dotfiles]
# NB: sources must be absolute (~/.dotfiles/...). This file also loads via the
# ~/.config/mise/config.toml symlink, and relative sources resolve from the
# symlink's directory whenever cwd is outside this repo (source missing).
"~/.bashrc.d/" = { source = "~/.dotfiles/bashrc.d/", mode = "symlink-each" }
"~/.config/bat/" = { source = "~/.dotfiles/bat/" }
"~/.config/fish/" = { source = "~/.dotfiles/fish/", mode = "symlink-each" }
"~/.config/ghostty/config.ghostty" = { source = "~/.dotfiles/ghostty/config.ghostty", mode = "template" }
"~/.config/git/allowed_signers" = { source = "~/.dotfiles/git/allowed_signers", mode = "template" }
"~/.config/git/config" = { source = "~/.dotfiles/git/config", mode = "template" }
"~/.config/git/ignore" = { source = "~/.dotfiles/git/ignore" }
"~/.config/jj/config.toml" = { source = "~/.dotfiles/jj/config.toml" }
"~/.config/mise/config.toml" = { source = "~/.dotfiles/mise.toml" }
"~/.config/mise/miserc.toml" = { source = "~/.dotfiles/.miserc.toml" }
"~/.config/nvim/" = { source = "~/.dotfiles/nvim/" }
"~/.config/pi/AGENTS.md" = { source = "~/.dotfiles/shared/AGENTS.md" }
"~/.config/pi/models.json" = { source = "~/.dotfiles/pi/models.json" }
"~/.config/pi/settings.json/base" = { source = "~/.dotfiles/pi/settings.json", merge = true }
"~/.local/bin/" = { source = "~/.dotfiles/bin/", mode = "symlink-each" }
"~/.ssh/conf.d/" = { source = "~/.dotfiles/ssh/conf.d/", mode = "symlink-each" }
"~/.ssh/config/include" = { line = "Include conf.d/*.conf" }

[tools]
"npm:bash-language-server" = "latest"
bat = "latest"
fd = "latest"
gh = "latest"
glow = "latest"
go = "latest"
neovim = "latest"
node = "lts"
pi = "latest"
ripgrep = "latest"
starship = "latest"
tree-sitter = "latest"
uv = "latest"
zoxide = "latest"
