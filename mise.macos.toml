[bootstrap.packages]
"brew:fish" = "latest"
# 1password app is MDM managed
"brew-cask:1password-cli" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:notion" = "latest"
# docker-desktop

[dotfiles]
"~/.config/claude/CLAUDE.md" = { source = "shared/AGENTS.md" }
"~/.config/claude/settings.json" = { source = "claude/settings.json", mode = "copy" }
"~/.config/codex/AGENTS.md" = { source = "shared/AGENTS.md" }
"~/.config/mise/config.macos.toml" = "mise.macos.toml"

[tools]
claude = "latest"
coder = "latest"
codex = "latest"
helm-ls = "latest"
kubectl = "1.32"
