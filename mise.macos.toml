[bootstrap.packages]
"brew:fish" = "latest"
# "brew:gnupg" = "latest"
# "brew:pinentry-mac" = "latest"
# 1password app is MDM managed
"brew-cask:1password-cli" = "latest"
"brew-cask:claude" = "latest"
# "brew-cask:docker-desktop" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:orion"  = "latest"

[dotfiles]
# NB: absolute sources only (see note in mise.toml).
"~/.config/claude/CLAUDE.md" = { source = "~/.dotfiles/shared/AGENTS.md" }
"~/.config/claude/settings.json" = { source = "~/.dotfiles/claude/settings.json", mode = "copy" }
"~/.config/codex/AGENTS.md" = { source = "~/.dotfiles/shared/AGENTS.md" }
"~/.config/mise/config.macos.toml" = { source = "~/.dotfiles/mise.macos.toml" }
"~/.config/pi/auth.json" = { source = "~/.dotfiles/pi/auth.macos.json", mode = "copy" }
"~/.config/pi/settings.json/shared" = { source = "~/.dotfiles/pi/settings.macos.json", merge = true }

[tools]
claude = "latest"
coder = "latest"
codex = "latest"
"go:golang.org/x/tools/gopls" = "latest"
helm-ls = "latest"
kubectl = "1.32"
terraform-ls = "latest"
"npm:yaml-language-server" = "latest"
