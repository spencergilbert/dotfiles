[bootstrap.hooks.pre-packages]
run = "mise run setup-dnf-repos"

[bootstrap.packages]
"dnf:1password" = "latest"
"dnf:1password-cli" = "latest"
"dnf:cmake" = "latest"
"dnf:fish" = "latest"
"dnf:gcc" = "latest"
"dnf:ghostty" = "latest"

[tools]
glab = "latest"
"go:github.com/alyraffauf/tg/cmd/tg" = "latest"

[dotfiles]
# NB: absolute sources only (see note in mise.toml).
"~/.config/mise/config.linux.toml" = { source = "~/.dotfiles/mise.linux.toml" }
"~/.config/pi/auth.json" = { source = "~/.dotfiles/pi/auth.linux.json", mode = "copy" }
"~/.config/pi/settings.json/shared" = { source = "~/.dotfiles/pi/settings.linux.json", merge = true }
"~/.ssh/authorized_keys" = { source = "~/.dotfiles/ssh/authorized_keys" }
