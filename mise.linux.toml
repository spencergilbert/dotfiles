[bootstrap.hooks.pre-packages]
run = "mise run setup-dnf-repos"

[bootstrap.packages]
"dnf:1password" = "latest"
"dnf:1password-cli" = "latest"
"dnf:fish" = "latest"
"dnf:ghostty" = "latest"

[dotfiles]
"~/.config/mise/config.linux.toml" = "mise.linux.toml"
"~/.ssh/authorized_keys" = { source = "ssh/authorized_keys" }
