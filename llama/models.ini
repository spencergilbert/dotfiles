version = 1

; ============================================================================
; llama.cpp router presets — Strix Halo (Radeon 8060S, 126 GiB unified VRAM)
;
; Launch (router mode — note: NO -m flag):
;   llama-server --models-preset ~/.config/llama.cpp/models.ini --host 0.0.0.0 --port 9931
;
; Route requests by "model" id:
;   POST /v1/chat/completions  {"model": "qwen3.8-27b",      "messages": [...]}
; ============================================================================

; ---------------------------------------------------------------------------
; Global defaults shared by every model instance (overridable per-model)
; ---------------------------------------------------------------------------
[*]
n-gpu-layers  = 99
flash-attn    = on
jinja         = true
metrics       = true ; Prometheus /metrics endpoint (per-model: /metrics?model=...)

; ---------------------------------------------------------------------------
; Qwen3.8-27B — Alibaba, agentic + multimodal
; Quant: UD-Q8_K_XL (29.3 GiB) — best practical quality (BF16 = 4.2 t/s, too slow).
; With built-in MTP (n_max 4): ~13.2 t/s decode (vs 7.2 t/s bare).
; Speed-first alternative: Qwen3.8-27B-UD-Q6_K_XL.gguf (~8.5 t/s bare).
; ---------------------------------------------------------------------------
[qwen3.8-27b]
model              = /home/spencer/.cache/models/Qwen3.8-27B-UD-Q8_K_XL.gguf
mmproj             = /home/spencer/.cache/models/Qwen3.8-27B-mmproj-BF16.gguf
spec-type          = draft-mtp
spec-draft-n-max   = 4
chat-template-file = /home/spencer/.config/llama.cpp/qwen-fixed-chat_template.jinja
reasoning-format   = deepseek
reasoning          = auto
reasoning-effort   = medium
reasoning-preserve = true
temperature        = 1.0
top-p              = 0.95
top-k              = 20
min-p              = 0.0
presence-penalty   = 0.0
repeat-penalty     = 1.0
