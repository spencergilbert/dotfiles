mmproj             = /home/spencer/.cache/models/Qwen3.6-35B-A3B-mmproj-BF16.gguf
spec-type          = draft-mtp
spec-draft-n-max   = 2
chat-template-file = /home/spencer/.config/llama.cpp/qwen-fixed-chat_template.jinja
reasoning-format   = deepseek
reasoning          = auto
reasoning-preserve = true
temperature        = 1.0
top-p              = 0.95
top-k              = 20
min-p              = 0.0
