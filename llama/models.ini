version = 1

; ============================================================================
; llama.cpp router presets — Strix Halo (Radeon 8060S, 126 GiB unified VRAM)
; ============================================================================

; ---------------------------------------------------------------------------
; Global defaults shared by every model instance (overridable per-model)
; ---------------------------------------------------------------------------
[*]
n-gpu-layers  = 99
flash-attn    = on
jinja         = true
metrics       = true ; Prometheus /metrics endpoint (per-model: /metrics?model=...)

; ---------------------------------------------------------------------------
; Qwen3.6-35B-A3B — Alibaba, MoE 3B-active + multimodal. Fast all-rounder.
; ---------------------------------------------------------------------------
[qwen3.6-35b-a3b]
load-on-startup    = true
model              = /home/spencer/.cache/models/Qwen3.6-35B-A3B-UD-Q8_K_XL.gguf
mmproj             = /home/spencer/.cache/models/Qwen3.6-35B-A3B-mmproj-BF16.gguf
spec-type          = draft-mtp
spec-draft-n-max   = 2
chat-template-file = /home/spencer/.config/llama.cpp/qwen-fixed-chat_template.jinja
reasoning-format   = deepseek
reasoning          = auto
reasoning-preserve = true
temperature        = 1.0
top-p              = 0.95
top-k              = 20
min-p              = 0.0
presence-penalty   = 1.5
repeat-penalty     = 1.0

; ---------------------------------------------------------------------------
; Qwen3.8-27B — Alibaba, dense + multimodal. Deep reasoning.
; ---------------------------------------------------------------------------
[qwen3.8-27b]
model              = /home/spencer/.cache/models/Qwen3.8-27B-UD-Q4_K_M.gguf
mmproj             = /home/spencer/.cache/models/Qwen3.8-27B-mmproj-BF16.gguf
spec-type          = draft-mtp
spec-draft-n-max   = 4
chat-template-file = /home/spencer/.config/llama.cpp/qwen-fixed-chat_template.jinja
reasoning-format   = deepseek
reasoning          = auto
reasoning-effort   = medium
reasoning-preserve = true
temperature        = 1.0
top-p              = 0.95
top-k              = 20
min-p              = 0.0
presence-penalty   = 0.0
repeat-penalty     = 1.0

; ---------------------------------------------------------------------------
; Qwen3.8-Flash-Next — Qwen4-preview arch (qwen4exp), 125B total / 6B active.
;
; Speculative decoding: ngram-mod only for now. Master's converter marks qwen4exp
; as no_mtp (src/models/qwen4exp.cpp, conversion/qwen4exp.py), so the checkpoint's
; NextN/MTP head is dropped — do NOT expect draft-mtp to work on builds from master.
; MTP support is in review: ggml-org/llama.cpp#27836 (open, draft; adds the NextN/MTP
; draft head + `--mtp` converter flag; measured 85-89% acceptance, +36-42% tok/s at
; spec-draft-n-max 2-3 on M3 Max 128GB). Switch to draft-mtp once it lands and the
; GGUF has been re-converted with --mtp.
; ---------------------------------------------------------------------------
[qwen3.8-flash-next]
model              = /home/spencer/.cache/models/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
mmproj             = /home/spencer/.cache/models/Qwen3.8-Flash-Next-mmproj-BF16.gguf
chat-template-file = /home/spencer/.config/llama.cpp/qwen-fixed-chat_template.jinja
reasoning-format   = deepseek
reasoning          = auto
reasoning-preserve = true
spec-type          = ngram-mod
spec-ngram-mod-n-max = 32
spec-ngram-mod-n-min = 4
temperature        = 1.0
top-p              = 0.95
top-k              = 20
min-p              = 0.0
presence-penalty   = 0.0
repeat-penalty     = 1.0
