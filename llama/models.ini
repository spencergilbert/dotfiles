; ---------------------------------------------------------------------------
; Qwen3.8-Flash-Next — Qwen4-preview arch (qwen4exp), 125B total / 6B active.
; Thinking-mode sampling per official card. Vision via mmproj-BF16.
; UD-Q4_K_XL = ~104 GiB, PLE ngram table (~30 GiB) lazily served from SSD via
; mmap → ~74 GiB resident, fits 124 GiB GTT solo.
;
; Speculative decoding: ngram-mod only for now. Master's converter marks qwen4exp
; as no_mtp (src/models/qwen4exp.cpp, conversion/qwen4exp.py), so the checkpoint's
; NextN/MTP head is dropped — do NOT expect draft-mtp to work on builds from master.
; MTP support is in review: ggml-org/llama.cpp#27836 (open, draft; adds the NextN/MTP
; draft head + `--mtp` converter flag; measured 85-89% acceptance, +36-42% tok/s at
; spec-draft-n-max 2-3 on M3 Max 128GB). Switch to draft-mtp once it lands and the
; GGUF has been re-converted with --mtp.
;
; 1. spec-type = none → restart → send the same fixed /completion probe (temperature: 0, n_predict: 200, stream: false) twice, record timings.predicted_per_second from the second (prompt cached).
; 2. Repeat with ngram-mod + n_min = 4.
; 3. Compare; only then touch n_min = 16 vs 2.
; ---------------------------------------------------------------------------
[qwen3.8-flash-next]
model              = /home/spencer/.cache/models/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
mmproj             = /home/spencer/.cache/models/Qwen3.8-Flash-Next-mmproj-BF16.gguf
chat-template-file = /home/spencer/.config/llama.cpp/qwen-fixed-chat_template.jinja
reasoning-format   = deepseek
reasoning          = auto
reasoning-preserve = true
spec-type          = ngram-mod
spec-ngram-mod-n-max = 32
spec-ngram-mod-n-min = 16
temperature        = 1.0
top-p              = 0.95
top-k              = 20
min-p              = 0.0
presence-penalty   = 0.0
repeat-penalty     = 1.0
